# Port supplied by the hosting platform (defaults to 8080 locally).
server.port=${PORT:8080}

# Local MySQL is the default. Hosted environments should set the datasource
# variables to their managed database connection. Spring Boot infers the driver
# from the JDBC URL; both MySQL and PostgreSQL drivers are available.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Keep schema updates enabled for this portfolio demo. Use a migration tool
# and a controlled schema strategy before production use.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Cache templates by default on hosted environments. Override locally if needed.
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# Set APP_DEMO_READ_ONLY=true on a public portfolio deployment to prevent visitors
# from creating, editing, or deleting shared demo content.
app.demo.read-only=${APP_DEMO_READ_ONLY:false}

spring.application.name=blog-application
