# =============================================
# Database Configuration (MySQL)
# =============================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/blogdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# =============================================
# Thymeleaf
# =============================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# Server
# =============================================
server.port=${PORT:8080}

# Public demo mode disables all write routes and hides edit controls.
app.demo.read-only=${APP_DEMO_READ_ONLY:false}

# =============================================
# App Info
# =============================================
spring.application.name=blog-application
