name: Java CI

on:
  push:
    branches: ["main", "live-demo-ready"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: blog-app/pom.xml
      - name: Build and test
        run: mvn -B -ntp clean verify
